# Render blueprint for the FluxStrap voice server (VoiceServer/)
# On render.com: New > Blueprint, pick this repository, then fill in KEY_SECRET when asked
services:
  - type: web
    name: fluxstrap-voice
    runtime: node
    plan: free
    rootDir: VoiceServer
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      # the secret dev keys are signed with, see VoiceServer/keygen.js
      - key: KEY_SECRET
        sync: false
